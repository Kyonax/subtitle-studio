# =============================================================================
# subtitle-studio — local-first transcription / diarization / subtitle pipeline
# =============================================================================
# THE STRICTEST CONTRACT IN THE QUEUE.
#
# Public repository, real software, and — uniquely among the enrolled repos —
# it PROCESSES OTHER PEOPLE'S MEDIA. A run here can leak three different kinds
# of thing, and each gets its own defence:
#
#   1. A Hugging Face token. Diarization needs one; it lives in .env, which is
#      gitignored, and `.env*` is on never_commit as a second line.
#   2. Someone's video, audio, or transcript. Every job writes a `<name>.studio/`
#      directory of intermediates that contains the full transcript of whatever
#      was processed. Gitignored, and on never_commit as well.
#   3. A behaviour change nobody reviewed. `src/**` is on require_pr.
#
# Belt and braces on 1 and 2 is deliberate: .gitignore is one `git add -f` away
# from being bypassed, and never_commit ABORTS the run instead of quietly
# unstaging — so the two mechanisms fail differently.
#
# Fingerprinted. Edit this and shipwright refuses to run until:
#     shipwright approve subtitle-studio
# =============================================================================

schema = 1

[repo]
name = "subtitle-studio"

# Tier: mine, but reviewed. Declaring it makes the minimum binding —
# a pull-request mode, or a require_pr list naming what must be looked at.
tier = "guarded"
default_branch = "main"
remote = "origin"
hot_window_min = 1
# Seconds, not minutes. A whole minute of sitting on finished work is a
# long time; this is the wait that stops a run landing on top of an edit
# you are still making, and 30s is enough for that.
hot_window_s = 30

[commit]
types = ["feat", "fix", "refactor", "perf", "docs", "test", "build", "chore"]
scope_required = false

# Match the package layout so a slot yields readable, themed commits.
scopes = ["asr", "stages", "subtitles", "translate", "tui", "web", "tests", "fonts", "docs"]
split_by_scope = true

# Recalibrated 2026-08-20. The old value of 30 was set against a 62-file tree;
# the browser studio (web/ plus src/subtitle_studio/web/) takes the publishable
# tree to roughly 111 files, so the same "half the tree" judgement lands near 70.
#
# The ceiling is not the only thing standing between a large change and main:
# require_pr covers src/**, web/src/**, web/package.json, web/vite.config.js and
# pyproject.toml, so anything that changes behaviour goes onto an auto/ branch as
# a pull request and a human reads it before it merges. This number stops a slot
# from proposing a whole tree rewrite; review stops everything else.
max_files = 70

trailer = true

[flow]
mode = "direct"
branch_prefix = "auto/"
pr_draft = false
pr_reviewers = []
restore_branch = true

[gates]
# Nothing is published unless the suite is green. The real output becomes the
# `Gates:` line, so a commit cannot claim tests that did not run.
pre_commit = ["uv run ruff check src tests"]
pre_push   = ["uv run pytest -q"]

# Generous: a cold uv sync can be slow, and the alternative is a false failure.
timeout_s = 900

[tag]
# pyproject declares 0.1.0. Enable this when there is a release process; it
# reacts to a version you already bumped, it never invents one.
enabled = false
when = "never"
manifest = "pyproject.toml"
pattern = "v{version}"

[paths]
# The mandatory 13-pattern floor is unioned in. Everything below is IN ADDITION
# and specific to what this program handles.
never_commit = [
  # 1. The token. .gitignore covers these too; this makes a bypass fail loudly.
  ".env",
  ".env.*",
  "config.toml",

  # 2. Other people's content and everything derived from it. A .studio/
  #    directory holds the complete transcript of the media it processed.
  "*.studio/**",
  "examples/*.mkv",
  "examples/*.mp4",
  "examples/*.mov",
  "examples/*.wav",
  "examples/*.mp3",
  "examples/*.srt",
  "examples/*.ass",

  # 3. Model weights. Gigabytes, redistributable only sometimes, and always
  #    reproducible from the cache.
  "*.bin",
  "*.safetensors",
  "*.ct2",
  "models/**",

  # 4. Environment and build output.
  ".venv/**",
  "__pycache__/**",
  ".pytest_cache/**",
  ".ruff_cache/**",
  "*.egg-info/**",

  # 5. The web studio's dependencies and its build. Both are reproducible from
  #    web/package.json with `npm install && npm run build`.
  "web/node_modules/**",
  "web/dist/**",
]

# Source changes behaviour; behaviour on a public repo gets a diff someone
# looked at. Docs, styles and fonts still push directly.
require_pr = ["src/**", "web/src/**", "web/package.json", "web/vite.config.js", "pyproject.toml", ".github/**"]

[repair]
process = true

# OFF, as with kyo-recording-automation. A conflict in working source is a
# decision about program behaviour. A failed run waiting for you beats a
# resolution you did not make.
conflicts = false
max_attempts = 2

[schedule]
slots = ["03:00", "06:00", "09:00", "11:00", "13:00", "15:00", "18:00", "21:00", "23:00"]
min_interval_min = 0

# -----------------------------------------------------------------------------
# [context] - which brain session node explains the work in this repository.
# -----------------------------------------------------------------------------
# Shipwright only ever READS that node. The map lives HERE, in a file that is
# fingerprinted and approved, rather than being searched for at run time: an
# agent acting on the WRONG context is a worse failure than one acting on none.
#
# Until this block existed in a live contract, every repo in the fleet resolved
# by the drawer fallback instead - two of ten resolved at all, and the two that
# did were decided by a :PATH: string match that two different nodes can claim.
[context]
session = "subtitle-studio"
branches = {}
