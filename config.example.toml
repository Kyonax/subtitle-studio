# subtitle-studio main config — copy to ~/.config/subtitle-studio/config.toml
# Everything here has a sensible default; uncomment to override.

[asr]
# engine = "whisperx"            # whisperx | faster-whisper (fallback engine)
# model = "large-v3"
# compute_type = "int8_float16"  # fits the 6GB GTX 1660 SUPER
# batch_size = 8                 # auto-retries at 4 -> 2 on CUDA OOM
# max_segment_seconds = 8.0      # split longer segments at word pauses, 0 = off
# language = "es"                # unset = auto-detect

[diarization]
# model = "pyannote/speaker-diarization-3.1"
# min_speakers = 1
# max_speakers = 4

[translation]
# provider = "madlad"            # local, free (MADLAD-400-3B via CTranslate2)
# device = "cuda"                # cpu also works (32GB RAM)
# beam_size = 4

[render]
# codec = "h264_nvenc"           # or hevc_nvenc, libx264
# preset = "p5"
# cq = 19

[paths]
# fonts_dir = "/run/media/kyonax/Da_ Disk/dev/github-kyonax/subtitle-studio/fonts"
# models_dir = "~/.cache/subtitle-studio/models"

[auth]
# hf_token = "hf_..."            # or export HF_TOKEN; needed once for pyannote gated models
