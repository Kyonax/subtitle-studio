# subtitle-studio central styles. One [default] reference with every supported key.
# Position is picked at style time with --position or the TUI, never here.
# Colors are "#RRGGBB" or "#RRGGBBAA", AA is opacity, 00 invisible, FF solid.

[meta]
# Coordinate space for every size below. "video" uses each video's real resolution, [1920, 1080] freezes one space for any video.
play_res = "video"
# Preset applied when no --preset is passed, must name a [style.NAME] below. Commented, no preset is defined yet.
# default_preset = "neon"

[default]
# Font family name or file stem inside fonts/, matched by family name.
font = "Roboto"
# Letter height in pixels, 56 reads well on 1080p.
size = 56
# Letter fill color, white survives any footage.
color = "#F9CD26"
# Bold cut of the font.
bold = true
# Slanted letters, hurts readability at subtitle size.
italic = false
# Force ALL CAPS, false keeps the text as transcribed.
uppercase = false
# Extra pixels between letters, 0.0 is the font's natural spacing.
letter_spacing = 0.0
# Width stretch in percent, 100 is undistorted.
scale_x = 100
# Height stretch in percent, 100 is undistorted.
scale_y = 100
# Outline around each letter, dark keeps light text readable, width in pixels, enabled false removes it.
stroke = { enabled = false, color = "#000000", width = 3.0 }
# Blurred light halo under the text, radius is blur, size is reach past the stroke.
glow = { enabled = false, color = "#00D5FF", radius = 6.0, size = 2.0 }
# Drop shadow, offset in pixels down and right, off because the box already separates.
shadow = { enabled = false, color = "#000000AA", offset = 2.0 }
# Box behind the text, padding is inner space x and y, rounded draws a measured pill with radius corners.
# mode applies when rounded is false, "box" is one box around the whole text, "opaque-per-line" boxes each line.
background = { enabled = true, color = "#000000AA", padding = { x = 16, y = 10 }, rounded = false, radius = 16.0, mode = "box" }
# Distance to frame edges in pixels, vertical applies to the anchored edge.
margin = { left = 80, right = 80, vertical = 60 }
# Line length in characters before wrapping, 42 is the subtitle habit.
max_line_chars = 40
# Lines shown at once, longer text becomes the next timed subtitle.
max_lines = 1
# Words shown per subtitle, 0 is no cap, 3 or 4 suits vertical clips.
max_words = 46

# Preset example. A preset lists only what differs from [default]. Uncomment, rename,
# then use it with --preset neon, the TUI dropdown, or meta default_preset.
# [style.neon]
# uppercase = true
# letter_spacing = 1.5
# glow = { enabled = true, color = "#00D5FF", radius = 7.0, size = 2.5 }
# background = { enabled = true, color = "#0A0A14B0", padding = { x = 24, y = 12 }, rounded = true, radius = 22.0 }

# Speaker override example. KEY is the stable id or the display name after a rename.
# [speaker.SPEAKER_00]
# color = "#7FD4FF"
