[project]
name = "subtitle-studio"
version = "0.1.0"
description = "Local-first transcription, speaker diarization, translation and styled-subtitle pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Cristian D. Moreno (Kyonax)", email = "kyonax.corp@gmail.com" }]
dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "pydantic>=2.9",
    "tomlkit>=0.13",
    "fonttools>=4.55",
    "fasttext-predict>=0.9.2.4",
]

[project.scripts]
subtitle-studio = "subtitle_studio.cli:app"

[project.optional-dependencies]
asr = [
    "whisperx>=3.8.6",
]
translate = [
    "sentencepiece>=0.2.2",
]
tui = [
    "textual>=8.2.8",
    "textual-image>=0.13.2",
]

[dependency-groups]
dev = ["pytest>=8.3"]

# Heavy ML extras are added in their build phase so the scaffold stays light:
#   asr       -> whisperx (torch/cu12x via the index below)   [Phase 1]
#   diarize   -> pyannote.audio                               [Phase 2]
#   translate -> ctranslate2, transformers, sentencepiece     [Phase 4]
#   tui       -> textual, textual-image                       [Phase 5]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subtitle_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
