[project]
name = "subtitle-studio"
version = "0.1.0"
description = "Local-first transcription, speaker diarization, translation and styled-subtitle pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Cristian D. Moreno (Kyonax)", email = "kyonax.corp@gmail.com" }]
dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "pydantic>=2.9",
    "tomlkit>=0.13",
    "fonttools>=4.55",
    "fasttext-predict>=0.9.2.4",
]

[project.scripts]
subtitle-studio = "subtitle_studio.cli:app"

[project.optional-dependencies]
asr = [
    "whisperx>=3.8.6",
]
translate = [
    "sentencepiece>=0.2.2",
]
tui = [
    "textual>=8.2.8",
    "textual-image>=0.13.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.14",
]

# Heavy ML extras are added in their build phase so the scaffold stays light:
#   asr       -> whisperx (torch/cu12x via the index below)   [Phase 1]
#   diarize   -> pyannote.audio                               [Phase 2]
#   translate -> ctranslate2, transformers, sentencepiece     [Phase 4]
#   tui       -> textual, textual-image                       [Phase 5]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subtitle_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Pinned deliberately, because this repo's lint runs UNATTENDED: shipwright's
# pre_commit gate is `uv run ruff check src tests`, and whatever that command
# means is what blocks or releases a scheduled commit.
#
# Without an explicit select, `ruff check` means "whatever this ruff release
# enables by default" — 413 rules under 0.16, and a different set under the
# next version. A dependency bump could then turn every slot red overnight for
# reasons nobody chose. So the standard is written down here instead.
#
# This is ruff's own documented default set: pycodestyle errors (E4 imports,
# E7 statements, E9 syntax) plus Pyflakes (F). Broaden it when the codebase is
# ready for it — adding a rule family is a deliberate act, not a side effect of
# upgrading a tool.
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
